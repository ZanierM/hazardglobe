<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm Globe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<style>
:root{
  --bg:#05070d; --panel:rgba(12,17,28,.86); --line:rgba(255,255,255,.1);
  --text:#e8edf5; --muted:#8e9bb0; --accent:#5ebaff;
  --TD:#5ebaff; --TS:#00d9d2; --C1:#ffe066; --C2:#ffc233; --C3:#ff9a1f; --C4:#ff5f2e; --C5:#e0245e;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#map{position:absolute;inset:0}
.panel{position:absolute;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#side{position:absolute;top:16px;left:16px;bottom:16px;width:320px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#side>*{pointer-events:auto;position:relative}
header.panel{padding:14px 16px;flex:none}
h1{margin:0;font-size:19px;letter-spacing:.2px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.4}
.stats{display:flex;gap:8px;margin-top:12px}
.stat{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:11px}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:6px}
.storm{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.storm:hover,.storm.active{background:rgba(255,255,255,.07)}
.badge{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#10131a}
.storm .nm{font-weight:600}
.storm .meta{color:var(--muted);font-size:12px}
.empty{padding:14px;color:var(--muted);font-size:13px;line-height:1.5}
#card{top:16px;right:16px;width:340px;padding:16px;display:none;max-height:calc(100% - 150px);overflow:auto}
#card.show{display:block}
#card h2{margin:0 0 2px;font-size:22px}
#card .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:8px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-size:15px}
.teach{border-left:3px solid var(--accent);padding:6px 10px;margin:10px 0;font-size:13.5px;line-height:1.5;background:rgba(94,186,255,.07);border-radius:0 8px 8px 0}
.q{font-size:13px;color:var(--muted);line-height:1.5}
.q li{margin:4px 0}
a{color:var(--accent)}
#controls{right:16px;bottom:16px;padding:10px 12px;font-size:13px}
#controls label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;white-space:nowrap}
#controls button{margin-top:6px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(94,186,255,.15);color:var(--text);font:inherit;cursor:pointer}
#legend{left:352px;bottom:16px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap}
#legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#sstkey{display:none;align-items:center;gap:6px;width:100%;color:var(--muted)}
#sstkey .bar{height:8px;flex:1;border-radius:4px;background:linear-gradient(90deg,#2b1a6b,#1e58c9,#15b3c6,#6fe07a,#f4e53a,#f28a1c,#c81d1d)}
#banner{left:50%;top:16px;transform:translateX(-50%);padding:10px 14px;font-size:13px;display:none;max-width:460px}
#banner.show{display:block}
#updated{color:var(--muted);font-size:11.5px;margin-top:8px}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.5)!important;color:#aaa}
.maplibregl-ctrl-attrib a{color:#ccc}
/* Classroom mode: bigger text, fewer panels */
body.classroom #list,body.classroom #legend{display:none}
body.classroom #side{width:auto;bottom:auto}
body.classroom h1{font-size:30px}
body.classroom #card{width:460px;font-size:18px}
body.classroom #card h2{font-size:34px}
body.classroom .teach{font-size:18px}
body.classroom .kv b{font-size:22px}
@media (max-width:760px){
  #side{right:16px;width:auto}
  #side .stats{display:none}
  #list{flex:0 0 30%;margin-top:auto}
  #legend{display:none}
  #controls{bottom:calc(30% + 28px)}
  #card{left:16px;right:16px;width:auto;top:auto;bottom:16px;max-height:55%}
}
</style>
</head>
<body>
<div id="map"></div>

<aside id="side">
<header class="panel">
  <h1>Storm <span>Globe</span></h1>
  <div class="sub">Tropical storms happening around the world right now. Refreshes every 30 minutes.</div>
  <div class="stats">
    <div class="stat"><b id="sCount">–</b><small>active storms</small></div>
    <div class="stat"><b id="sMajor">–</b><small>Cat 3 or above</small></div>
    <div class="stat"><b id="sBasins">–</b><small>ocean basins</small></div>
  </div>
  <div id="updated"></div>
</header>

<div id="list" class="panel"><div class="empty">Loading storms…</div></div>
</aside>

<div id="card" class="panel"></div>

<div id="banner" class="panel"></div>

<div id="legend" class="panel">
  <span><i style="background:var(--TD)"></i>Depression</span>
  <span><i style="background:var(--TS)"></i>Storm</span>
  <span><i style="background:var(--C1)"></i>Cat 1</span>
  <span><i style="background:var(--C2)"></i>2</span>
  <span><i style="background:var(--C3)"></i>3</span>
  <span><i style="background:var(--C4)"></i>4</span>
  <span><i style="background:var(--C5)"></i>5</span>
  <span style="color:var(--muted)">Track: solid = past, dashed = forecast</span>
  <div id="sstkey">Sea temp <span>cooler</span><span class="bar"></span><span>warmer</span></div>
</div>

<div id="controls" class="panel">
  <label><input type="checkbox" id="tCone" checked> Forecast cones</label>
  <label><input type="checkbox" id="tNight" checked> Day and night</label>
  <label><input type="checkbox" id="tLines" checked> Tropics and 5° lines</label>
  <label><input type="checkbox" id="tSst"> Sea surface temperature</label>
  <label><input type="checkbox" id="tSat"> Satellite (yesterday)</label>
  <label><input type="checkbox" id="tSpin" checked> Spin the globe</label>
  <button id="bClass">Classroom mode</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script type="module">
import { loadStorms } from './lib/gdacs.js';
/*__INLINE_GDACS__*/

const COLORS = { TD:'#5ebaff', TS:'#00d9d2', C1:'#ffe066', C2:'#ffc233', C3:'#ff9a1f', C4:'#ff5f2e', C5:'#e0245e' };
const STAGE_COLOR = ['match',['get','stage'],'TD',COLORS.TD,'TS',COLORS.TS,'HU',COLORS.C3,'#cccccc'];
const GIBS = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best';
const dayStr = (daysAgo) => new Date(Date.now() - daysAgo * 864e5).toISOString().slice(0, 10);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let storms = [];
let selected = null;

// ---------- Map ----------
const map = new maplibregl.Map({
  container: 'map',
  center: [-40, 20],
  zoom: 1.6,
  minZoom: 0.8,
  maxZoom: 8,
  attributionControl: { compact: true },
  style: {
    version: 8,
    projection: { type: 'globe' },
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] },
    sources: {
      earth: { type: 'raster', tileSize: 256, maxzoom: 8,
        tiles: [`${GIBS}/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg`],
        attribution: 'Imagery: NASA GIBS · Storms: <a href="https://www.gdacs.org" target="_blank">GDACS</a>' },
      sat: { type: 'raster', tileSize: 256, maxzoom: 9,
        tiles: [`${GIBS}/MODIS_Terra_CorrectedReflectance_TrueColor/default/${dayStr(1)}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`] },
      sst: { type: 'raster', tileSize: 256, maxzoom: 7,
        tiles: [`${GIBS}/GHRSST_L4_MUR_Sea_Surface_Temperature/default/${dayStr(2)}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png`] },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#000' } },
      { id: 'earth', type: 'raster', source: 'earth' },
      { id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } },
      { id: 'sst', type: 'raster', source: 'sst', layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.8 } },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

// Cyclone symbol drawn on a canvas (two spiral arms round an eye)
function cycloneIcon(color, southern) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  if (southern) g.scale(-1, 1);
  g.strokeStyle = color; g.fillStyle = color; g.lineCap = 'round';
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 4;
  for (const rot of [0, Math.PI]) {
    g.save(); g.rotate(rot);
    g.beginPath(); g.lineWidth = 6;
    g.arc(0, 0, 13, Math.PI * 0.05, Math.PI * 0.95);
    g.stroke();
    g.beginPath(); g.lineWidth = 5;
    g.moveTo(-13, 2); g.quadraticCurveTo(-16, 20, -2, 27); g.stroke();
    g.restore();
  }
  g.beginPath(); g.arc(0, 0, 7, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(0, 0, 3.5, 0, Math.PI * 2); g.fill();
  return g.getImageData(0, 0, s, s);
}

// ---------- Sun and night ----------
function sunPosition(date) {
  const d = (date - Date.UTC(2000, 0, 1, 12)) / 864e5;
  const g = (357.529 + 0.98560028 * d) * Math.PI / 180;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * Math.PI / 180;
  const e = (23.439 - 0.00000036 * d) * Math.PI / 180;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  let lon = (ra * 180 / Math.PI - gmst * 15) % 360;
  if (lon < -180) lon += 360; if (lon > 180) lon -= 360;
  return { lat: dec * 180 / Math.PI, lon };
}
function nightGeoJSON(now = new Date()) {
  const sun = sunPosition(now);
  const dec = Math.max(Math.abs(sun.lat), 0.01) * Math.sign(sun.lat || 1) * Math.PI / 180;
  const ring = [];
  for (let lon = -180; lon <= 180; lon += 2) {
    const ha = (lon - sun.lon) * Math.PI / 180;
    const lat = Math.atan(-Math.cos(ha) / Math.tan(dec)) * 180 / Math.PI;
    ring.push([lon, Math.max(-84.9, Math.min(84.9, lat))]); // stay inside the pole cap so the ring never crosses itself
  }
  const pole = dec > 0 ? -85 : 85; // night side contains the pole away from the sun
  ring.push([180, pole], [-180, pole], ring[0]);
  return {
    type: 'FeatureCollection',
    features: [
      { type: 'Feature', properties: { kind: 'night' }, geometry: { type: 'Polygon', coordinates: [ring] } },
      { type: 'Feature', properties: { kind: 'sun', label: 'Sun overhead' }, geometry: { type: 'Point', coordinates: [sun.lon, sun.lat] } },
    ],
  };
}

function refLines() {
  const line = (lat, label, kind) => ({ type: 'Feature', properties: { label, kind },
    geometry: { type: 'LineString', coordinates: Array.from({ length: 73 }, (_, i) => [-180 + i * 5, lat]) } });
  return { type: 'FeatureCollection', features: [
    line(0, 'Equator', 'eq'),
    line(23.44, 'Tropic of Cancer', 'tropic'), line(-23.44, 'Tropic of Capricorn', 'tropic'),
    line(5, '5°N: too little Coriolis force for storms', 'five'), line(-5, '5°S', 'five'),
  ] };
}

const BASIN_LABELS = { type: 'FeatureCollection', features: [
  ['North Atlantic · hurricanes', -45, 28], ['East Pacific · hurricanes', -120, 13],
  ['North-West Pacific · typhoons', 145, 22], ['North Indian · cyclones', 75, 12],
  ['South-West Indian · cyclones', 60, -16], ['Australian region · cyclones', 115, -14],
  ['South Pacific · cyclones', -170, -16],
].map(([label, x, y]) => ({ type: 'Feature', properties: { label }, geometry: { type: 'Point', coordinates: [x, y] } })) };

map.on('load', async () => {
  for (const [code, col] of Object.entries(COLORS)) {
    map.addImage(`cy-${code}-n`, cycloneIcon(col, false), { pixelRatio: 2 });
    map.addImage(`cy-${code}-s`, cycloneIcon(col, true), { pixelRatio: 2 });
  }

  map.addSource('night', { type: 'geojson', data: nightGeoJSON() });
  map.addLayer({ id: 'night', type: 'fill', source: 'night', filter: ['==', ['get', 'kind'], 'night'],
    paint: { 'fill-color': '#000814', 'fill-opacity': 0.62, 'fill-antialias': false } });
  map.addLayer({ id: 'sun', type: 'circle', source: 'night', filter: ['==', ['get', 'kind'], 'sun'],
    paint: { 'circle-radius': 6, 'circle-color': '#ffd24d', 'circle-blur': 0.4, 'circle-stroke-color': 'rgba(255,210,77,.35)', 'circle-stroke-width': 6 } });

  // Country borders
  try {
    const topo = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')).json();
    map.addSource('borders', { type: 'geojson', data: topojson.mesh(topo, topo.objects.countries) });
    map.addLayer({ id: 'borders', type: 'line', source: 'borders', paint: { 'line-color': 'rgba(255,255,255,.28)', 'line-width': 0.6 } });
  } catch (e) { console.warn('Borders not loaded', e); }

  map.addSource('ref', { type: 'geojson', data: refLines() });
  map.addLayer({ id: 'ref', type: 'line', source: 'ref', filter: ['==', ['get', 'kind'], 'eq'],
    paint: { 'line-color': '#ffffff', 'line-opacity': 0.5, 'line-width': 1 } });
  map.addLayer({ id: 'ref-dash', type: 'line', source: 'ref', filter: ['!=', ['get', 'kind'], 'eq'], paint: {
    'line-color': ['match', ['get', 'kind'], 'five', '#ff8fa3', '#ffd24d'],
    'line-opacity': 0.55, 'line-width': 1, 'line-dasharray': [4, 3] } });
  map.addLayer({ id: 'ref-label', type: 'symbol', source: 'ref', layout: {
    'symbol-placement': 'line', 'symbol-spacing': 600, 'text-field': ['get', 'label'], 'text-size': 11,
    'text-font': ['Open Sans Semibold'], 'text-offset': [0, -0.7] },
    paint: { 'text-color': ['match', ['get', 'kind'], 'five', '#ffb3c1', 'eq', '#ffffff', '#ffe08a'], 'text-halo-color': '#000', 'text-halo-width': 1.2 } });

  map.addSource('basins', { type: 'geojson', data: BASIN_LABELS });
  map.addLayer({ id: 'basins', type: 'symbol', source: 'basins', maxzoom: 4, layout: {
    'text-field': ['get', 'label'], 'text-size': 12, 'text-font': ['Open Sans Semibold'], 'text-letter-spacing': 0.08,
    'text-transform': 'uppercase', 'text-max-width': 12 },
    paint: { 'text-color': 'rgba(190,215,255,.55)', 'text-halo-color': 'rgba(0,0,0,.6)', 'text-halo-width': 1 } });

  const empty = { type: 'FeatureCollection', features: [] };
  for (const id of ['cones', 'tracks', 'points', 'storms']) map.addSource(id, { type: 'geojson', data: empty });

  map.addLayer({ id: 'cones', type: 'fill', source: 'cones', paint: { 'fill-color': '#ffffff', 'fill-opacity': ['case', ['get', 'sel'], 0.22, 0.1] } });
  map.addLayer({ id: 'cones-edge', type: 'line', source: 'cones', paint: { 'line-color': '#ffffff', 'line-opacity': 0.4, 'line-width': 0.8 } });
  map.addLayer({ id: 'tracks', type: 'line', source: 'tracks', filter: ['!', ['get', 'forecast']],
    layout: { 'line-cap': 'round' }, paint: { 'line-color': STAGE_COLOR, 'line-width': ['case', ['get', 'sel'], 3.5, 2] } });
  map.addLayer({ id: 'tracks-fc', type: 'line', source: 'tracks', filter: ['get', 'forecast'],
    paint: { 'line-color': STAGE_COLOR, 'line-width': ['case', ['get', 'sel'], 3, 1.6], 'line-dasharray': [2, 2] } });
  map.addLayer({ id: 'points', type: 'circle', source: 'points', minzoom: 2.5, paint: {
    'circle-radius': 2.6, 'circle-color': ['case', ['get', 'forecast'], 'rgba(255,255,255,0)', '#ffffff'],
    'circle-stroke-color': '#ffffff', 'circle-stroke-width': 1 } });
  map.addLayer({ id: 'storm-glow', type: 'circle', source: 'storms', paint: {
    'circle-radius': ['interpolate', ['linear'], ['zoom'], 1, 16, 6, 30], 'circle-color': ['get', 'color'], 'circle-opacity': 0.18, 'circle-blur': 0.6 } });
  map.addLayer({ id: 'storms', type: 'symbol', source: 'storms', layout: {
    'icon-image': ['get', 'icon'], 'icon-size': ['interpolate', ['linear'], ['zoom'], 1, 0.75, 6, 1.3],
    'icon-allow-overlap': true, 'icon-ignore-placement': true, 'icon-rotate': 0,
    'text-field': ['get', 'name'], 'text-font': ['Open Sans Semibold'], 'text-size': 13,
    'text-offset': [0, 1.9], 'text-anchor': 'top', 'text-optional': true },
    paint: { 'text-color': '#ffffff', 'text-halo-color': '#000', 'text-halo-width': 1.5 } });

  map.on('click', 'storms', (e) => select(e.features[0].properties.id, true));
  map.on('mouseenter', 'storms', () => (map.getCanvas().style.cursor = 'pointer'));
  map.on('mouseleave', 'storms', () => (map.getCanvas().style.cursor = ''));

  setInterval(() => map.getSource('night').setData(nightGeoJSON()), 60e3);
  animate();
  refresh();
  setInterval(refresh, 30 * 60e3);
});

// ---------- Data ----------
async function fetchStorms() {
  const api = new URLSearchParams(location.search).get('api') || './api/storms';
  try {
    const r = await fetch(api, { cache: 'no-store' });
    if (r.ok) return await r.json();
  } catch (e) { /* fall through */ }
  return await loadStorms(); // works when the page can reach GDACS directly
}

async function refresh() {
  try {
    const data = await fetchStorms();
    storms = data.storms || [];
    $('banner').classList.remove('show');
    $('updated').textContent = `Updated ${new Date(data.generated).toLocaleString('en-GB', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' })} · source: GDACS`;
    render();
  } catch (e) {
    console.error(e);
    $('banner').innerHTML = '<b>Couldn’t load live storm data.</b> This page needs its small data service (<code>/api/storms</code>), so it has to be run from Vercel rather than opened as a file.';
    $('banner').classList.add('show');
    $('list').innerHTML = '<div class="empty">No data yet.</div>';
  }
}

function render() {
  const sel = (s) => s.id === selected;
  map.getSource('storms').setData({ type: 'FeatureCollection', features: storms.map((s) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
    properties: { id: s.id, name: s.name, color: COLORS[s.category.code], icon: `cy-${s.category.code}-${s.lat >= 0 ? 'n' : 's'}`, spin: s.lat >= 0 ? -1 : 1 } })) });
  map.getSource('tracks').setData({ type: 'FeatureCollection', features: storms.flatMap((s) => (s.track || []).map((t) => ({
    type: 'Feature', geometry: { type: 'LineString', coordinates: t.coords }, properties: { stage: t.stage, forecast: t.forecast, sel: sel(s) } }))) });
  map.getSource('points').setData({ type: 'FeatureCollection', features: storms.flatMap((s) => (s.points || []).map((p) => ({
    type: 'Feature', geometry: { type: 'Point', coordinates: p.c }, properties: { forecast: p.forecast } }))) });
  map.getSource('cones').setData({ type: 'FeatureCollection', features: storms.filter((s) => s.cone).map((s) => ({
    type: 'Feature', geometry: s.cone, properties: { sel: sel(s) } })) });

  const major = storms.filter((s) => /C[345]/.test(s.category.code)).length;
  $('sCount').textContent = storms.length;
  $('sMajor').textContent = major;
  $('sBasins').textContent = new Set(storms.map((s) => s.basin.name)).size;

  $('list').innerHTML = storms.length ? storms.map((s) => `
    <div class="storm ${sel(s) ? 'active' : ''}" data-id="${esc(s.id)}">
      <div class="badge" style="background:${COLORS[s.category.code]}">${esc(s.category.short)}</div>
      <div><div class="nm">${esc(s.name)}</div>
      <div class="meta">${esc(s.basin.name)} · ${s.windKmh} km/h</div></div>
    </div>`).join('') : '<div class="empty">No active tropical storms right now. Quiet spells are normal, especially outside each basin’s season.</div>';
  $('list').querySelectorAll('.storm').forEach((el) => el.addEventListener('click', () => select(el.dataset.id, true)));
  if (selected) showCard(storms.find((s) => s.id === selected));
}

// ---------- Storm card ----------
const fmtDate = (s) => s ? new Date(s + (s.endsWith('Z') ? '' : 'Z')).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '–';
const latStr = (lat) => `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}`;
const lonStr = (lon) => `${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;

function select(id, fly) {
  selected = id;
  const s = storms.find((x) => x.id === id);
  if (!s) return;
  stopSpin();
  render();
  if (fly) map.flyTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 3.4), speed: 0.8 });
}

function showCard(s) {
  const card = $('card');
  if (!s) { card.classList.remove('show'); return; }
  const days = Math.max(1, Math.round((Date.parse(s.to + 'Z') - Date.parse(s.from + 'Z')) / 864e5));
  const north = s.lat >= 0;
  const cat = s.category;
  const catText = /C\d/.test(cat.code) ? `a <b>${cat.label}</b> ${s.basin.term}` : `a <b>${cat.label.toLowerCase()}</b>`;
  const fc = (s.points || []).filter((p) => p.forecast);
  const last = fc[fc.length - 1];
  const questions = [
    `It is at ${latStr(s.lat)}. Why do tropical storms almost never form within 5° of the Equator?`,
    `Turn on <i>Sea surface temperature</i>. Is the ocean under it above 27°C? What happens if it moves over cooler water?`,
    last ? `The forecast takes it to about ${latStr(last.c[1])}, ${lonStr(last.c[0])} by ${fmtDate(last.t)}. Will it strengthen or weaken there, and why?` : `What would make this storm weaken?`,
    s.countries.length ? `It may affect ${esc(s.countries.join(', '))}. How might the impacts differ between an HIC and an LIC?` : `It is out at sea. Who might still be affected (shipping, islands, fishing)?`,
  ];
  card.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    <div class="badge" style="background:${COLORS[cat.code]};float:right;margin:4px 26px 0 0">${esc(cat.short)}</div>
    <h2>${esc(s.name)}</h2>
    <div class="sub">${esc(s.basin.name)} · ${latStr(s.lat)}, ${lonStr(s.lon)}</div>
    <div class="kv">
      <div><small>Max sustained wind</small><b>${s.windKmh} km/h</b><br><small>${s.windMph} mph</small></div>
      <div><small>Strength</small><b>${esc(cat.label)}</b></div>
      <div><small>Active since</small><b>${fmtDate(s.from)}</b><br><small>${days} day${days > 1 ? 's' : ''}</small></div>
      <div><small>GDACS alert</small><b>${esc(s.alert)}</b><br><small>humanitarian impact</small></div>
    </div>
    <div class="teach">This is ${catText}. In the ${esc(s.basin.name)}, storms like this are called <b>${s.basin.term}s</b>.</div>
    <div class="teach">It spins <b>${north ? 'anticlockwise' : 'clockwise'}</b> because it is in the ${north ? 'Northern' : 'Southern'} Hemisphere. The Coriolis effect turns the inflowing air.</div>
    <div class="q"><b style="color:var(--text)">Discuss</b><ol>${questions.map((q) => `<li>${q}</li>`).join('')}</ol></div>
    <div class="sub">Solid line: where it has been. Dashed line and white cone: where forecasters expect it to go. ${s.report ? `<a href="${esc(s.report)}" target="_blank" rel="noopener">Full GDACS report</a>` : ''}</div>`;
  card.querySelector('.close').onclick = () => { selected = null; render(); card.classList.remove('show'); };
  card.classList.add('show');
}

// ---------- Animation: spinning storms and slow globe rotation ----------
let spinning = true, userBusy = false;
function stopSpin() { spinning = false; $('tSpin').checked = false; }
map.on('mousedown', () => (userBusy = true));
map.on('touchstart', () => (userBusy = true));
map.on('mouseup', () => (userBusy = false));
map.on('touchend', () => (userBusy = false));
map.on('dragstart', stopSpin);

function animate() {
  let last = performance.now(), angle = 0, acc = 0;
  const tick = (t) => {
    const dt = t - last; last = t; acc += dt;
    if (acc > 50) { // ~20 fps is plenty
      angle = (angle + acc * 0.12) % 360; acc = 0;
      if (map.getLayer('storms')) map.setLayoutProperty('storms', 'icon-rotate', ['*', ['get', 'spin'], angle]);
      if (spinning && !userBusy && !map.isMoving()) {
        const c = map.getCenter();
        map.jumpTo({ center: [c.lng + 0.06, c.lat] });
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ---------- Controls ----------
const vis = (ids, on) => ids.forEach((id) => map.getLayer(id) && map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));
$('tCone').onchange = (e) => vis(['cones', 'cones-edge'], e.target.checked);
$('tNight').onchange = (e) => vis(['night', 'sun'], e.target.checked);
$('tLines').onchange = (e) => vis(['ref', 'ref-dash', 'ref-label'], e.target.checked);
$('tSst').onchange = (e) => { vis(['sst'], e.target.checked); $('sstkey').style.display = e.target.checked ? 'flex' : 'none'; };
$('tSat').onchange = (e) => vis(['sat'], e.target.checked);
$('tSpin').onchange = (e) => (spinning = e.target.checked);
$('bClass').onclick = () => {
  const on = document.body.classList.toggle('classroom');
  $('bClass').textContent = on ? 'Exit classroom mode' : 'Classroom mode';
  if (on && !selected && storms[0]) select(storms[0].id, true);
};
</script>
