<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hazard Globe</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<style>
:root{
  --bg:#05070d; --panel:rgba(12,17,28,.88); --line:rgba(255,255,255,.1); --soft:rgba(255,255,255,.05);
  --text:#e8edf5; --muted:#8e9bb0; --accent:#5ebaff;
  --TD:#5ebaff; --TS:#00d9d2; --C1:#ffe066; --C2:#ffc233; --C3:#ff9a1f; --C4:#ff5f2e; --C5:#e0245e;
  --shallow:#ff4d4d; --inter:#ffb000; --deep:#4da3ff;
  --constructive:#3ddc97; --destructive:#ff5c5c; --collision:#c77dff; --conservative:#ffd166;
  --font: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}
#map{position:absolute;inset:0}
.panel{background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#card,#controls,#legend,#banner,#player{position:absolute}
#side{position:absolute;top:16px;left:16px;bottom:16px;width:330px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
#side>*{pointer-events:auto}
header.panel{padding:14px 16px;flex:none}
h1{margin:0;font-size:19px;letter-spacing:.2px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.45}
.tabs{display:flex;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px;margin-top:12px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:7px 6px;border-radius:7px;cursor:pointer}
.tabs button.on{background:rgba(94,186,255,.18);color:var(--text)}
.stats{display:flex;gap:8px;margin-top:10px}
.stat{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 8px}
.stat b{display:block;font-size:19px}
.stat small{color:var(--muted);font-size:11px;line-height:1.2;display:block}
#updated{color:var(--muted);font-size:11.5px;margin-top:8px}
#list{flex:1 1 auto;min-height:0;overflow:auto;padding:6px}
#list .tabs{margin:2px 4px 6px}
.group{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 4px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer}
.item:hover,.item.active{background:rgba(255,255,255,.07)}
.badge{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#10131a}
.badge.tri{border-radius:8px;clip-path:polygon(50% 6%,96% 94%,4% 94%);padding-top:10px;font-size:11px}
.item .nm{font-weight:600;font-size:14px}
.item .meta{color:var(--muted);font-size:12px}
.empty{padding:14px;color:var(--muted);font-size:13px;line-height:1.5}
#card{top:16px;right:16px;width:350px;padding:16px;display:none;max-height:calc(100% - 32px);overflow:auto}
#card.show{display:block}
#card h2{margin:0 0 2px;font-size:22px;padding-right:56px}
#card .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer}
#card .badge{position:absolute;top:14px;right:40px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.kv div{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px}
.kv small{display:block;color:var(--muted);font-size:11px}
.kv b{font-size:15px}
.teach{border-left:3px solid var(--accent);padding:6px 10px;margin:10px 0;font-size:13.5px;line-height:1.5;background:rgba(94,186,255,.07);border-radius:0 8px 8px 0}
.facts{margin:10px 0;padding-left:18px;font-size:13.5px;line-height:1.5}
.facts li{margin:3px 0}
.q{font-size:13px;color:var(--muted);line-height:1.5}
.q ol{padding-left:18px;margin:6px 0}
.q li{margin:4px 0}
.src{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--soft);border:1px solid var(--line);margin-right:4px}
a{color:var(--accent)}
#controls{right:56px;bottom:40px;padding:10px 12px;font-size:13px;max-height:calc(100% - 56px);overflow:auto;z-index:4}
#controls summary{cursor:pointer;font-weight:600;list-style:none;padding:2px 18px 2px 2px;position:relative}
#controls summary::after{content:'▴';position:absolute;right:0;color:var(--muted)}
#controls[open] summary{margin-bottom:6px}
#controls[open] summary::after{content:'▾'}
#controls label{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer;white-space:nowrap}
#controls .sep{border-top:1px solid var(--line);margin:6px 0}
#controls button{margin-top:6px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:rgba(94,186,255,.15);color:var(--text);font:inherit;cursor:pointer}
#controls .livehide{display:none}
body.cases #controls .liveonly{display:none}
#legend{left:362px;bottom:16px;padding:8px 12px;font-size:12px;max-width:calc(100% - 590px)}
#legend,.legend{font-size:12px}
.legend .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:2px 0}
.legend .row b{color:var(--muted);font-weight:600;min-width:72px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend i.ln{width:16px;height:3px;border-radius:2px;vertical-align:2px}
#player{left:50%;transform:translateX(-50%);bottom:16px;padding:10px 14px;display:none;align-items:center;gap:12px;width:min(560px,calc(100% - 32px))}
#player.show{display:flex}
body.cases.playing #legend{display:none}
#player button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:#07111e;font-size:16px;cursor:pointer}
#player input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
#player .t{min-width:150px;font-size:12.5px;line-height:1.3}
#player .t small{color:var(--muted)}
#player select{background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;padding:3px}
#banner{left:50%;top:16px;transform:translateX(-50%);padding:10px 14px;font-size:13px;display:none;max-width:460px;z-index:5}
#banner.show{display:block}
.maplibregl-ctrl-attrib{background:rgba(0,0,0,.5)!important;color:#aaa}
.maplibregl-ctrl-attrib a{color:#ccc}
body.classroom #list,body.classroom #legend,body.classroom #side .stats{display:none}
body.classroom #side{width:auto;bottom:auto}
body.classroom h1{font-size:30px}
body.classroom #card{width:470px;font-size:18px}
body.classroom #card h2{font-size:32px}
body.classroom .teach,body.classroom .facts{font-size:18px}
body.classroom .kv b{font-size:22px}
#sheetHandle{display:none}
#controlsLegend{display:none}
.chead .more{display:none}
/* ---------- Tablet and phone: map first, panels as sheets ---------- */
@media (max-width:1099px){
  #side{top:12px;left:12px;right:12px;bottom:12px;width:auto;gap:0}
  header.panel{padding:8px 10px;display:flex;align-items:center;gap:10px;margin-right:112px}
  h1{font-size:16px;white-space:nowrap}
  #subtitle,#stats,#updated{display:none!important}
  header .tabs{margin-top:0;flex:1;max-width:300px}
  header .tabs button{padding:6px 4px;font-size:12.5px}
  #list{position:absolute;left:0;right:0;bottom:0;max-height:60vh;padding:0 6px 6px;display:flex;flex-direction:column}
  #sheetHandle{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--text);font:inherit;font-size:14px;font-weight:600;padding:12px 8px 10px;cursor:pointer;flex:none}
  #sheetHandle::before{content:'';position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:rgba(255,255,255,.25)}
  #sheetHandle .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
  #list.open #sheetHandle .chev{transform:rotate(180deg)}
  #listBody{overflow:auto;min-height:0}
  #list:not(.open) #listBody{display:none}
  body.carded #list{display:none}
  #card{left:12px;right:12px;top:auto;bottom:12px;width:auto;max-height:62vh;padding:12px 14px}
  #card h2{font-size:19px}
  #card .badge{width:34px;height:34px;font-size:12px;top:12px}
  .chead{cursor:pointer}
  .chead .more{display:inline-block;margin-top:6px;border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:0;cursor:pointer}
  #card.peek .cbody{display:none}
  #card.peek #csNow{margin-bottom:0}
  #legend{display:none!important}
  #controls{top:12px;right:12px;bottom:auto;max-height:calc(100% - 24px);width:auto;max-width:calc(100% - 24px)}
  #controls:not([open]){padding:0}
  #controls:not([open]) summary{padding:11px 30px 11px 14px}
  #controls:not([open]) summary::after{right:12px;top:11px}
  #controls[open]{width:280px}
  #controls[open] #controlsLegend{display:block;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
  #controls .legend .row b{min-width:0;width:100%}
  #bClass{display:none}
  #player{bottom:calc(var(--sheetH,56px) + 22px);width:calc(100% - 24px);padding:8px 10px;gap:8px}
  #player .t{min-width:0;flex:none;max-width:40%}
  #player button{width:36px;height:36px}
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl-group{display:none}
  .maplibregl-ctrl-bottom-right{top:62px;bottom:auto}
  body.classroom #card{width:auto}
}
/* Tablets: sheets sit bottom-left, replay controls bottom-right */
@media (max-width:1099px) and (min-width:700px){
  #list{right:auto;width:400px}
  #card{right:auto;width:400px;max-height:70vh}
  #player{left:auto;right:12px;transform:none;bottom:12px;width:calc(100% - 436px)}
}
@media (max-width:480px){
  h1{display:none}
  header.panel{margin-right:64px}
  #controls summary .lbl{display:none}
  #player select{display:none}
}
</style>
</head>
<body>
<div id="map"></div>

<aside id="side">
  <header class="panel">
    <h1>Hazard <span>Globe</span></h1>
    <div class="sub" id="subtitle">Tropical storms and earthquakes happening around the world right now.</div>
    <div class="tabs" role="tablist">
      <button id="mLive" class="on" role="tab">Live now</button>
      <button id="mCases" role="tab">Case studies</button>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><b id="sStorms">–</b><small>active tropical storms</small></div>
      <div class="stat"><b id="sQuakes">–</b><small>earthquakes M4.5+ this week</small></div>
      <div class="stat"><b id="sBig">–</b><small>largest this week</small></div>
    </div>
    <div id="updated"></div>
  </header>
  <div id="list" class="panel"><button id="sheetHandle" aria-expanded="false"><span id="sheetText">Loading…</span><span class="chev">▲</span></button><div id="listBody"><div class="empty">Loading…</div></div></div>
</aside>

<div id="card" class="panel"></div>
<div id="banner" class="panel"></div>

<div id="player" class="panel">
  <button id="pPlay" aria-label="Play">▶</button>
  <input id="pSlider" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <div class="t" id="pTime"></div>
  <select id="pSpeed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
</div>

<div id="legend" class="panel legend"></div>

<details id="controls" class="panel">
  <summary>☰ <span class="lbl">Layers</span></summary>
  <label class="liveonly"><input type="checkbox" id="tStorms" checked> Tropical storms</label>
  <label class="liveonly"><input type="checkbox" id="tQuakes" checked> Earthquakes</label>
  <label class="liveonly"><input type="checkbox" id="tCone" checked> Forecast cones</label>
  <label><input type="checkbox" id="tPlates" checked> Plate boundaries</label>
  <div class="sep"></div>
  <label><input type="checkbox" id="tNight" checked> Day and night</label>
  <label><input type="checkbox" id="tLines" checked> Tropics and 5° lines</label>
  <label><input type="checkbox" id="tSst"> Sea surface temperature</label>
  <label><input type="checkbox" id="tSat"> Satellite (yesterday)</label>
  <label><input type="checkbox" id="tSpin" checked> Spin the globe</label>
  <button id="bClass">Classroom mode</button>
  <div id="controlsLegend" class="legend"></div>
</details>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script type="module">
import { loadStorms, category } from './lib/gdacs.js';

// ================= Constants and helpers =================
const COLORS = { TD:'#5ebaff', TS:'#00d9d2', C1:'#ffe066', C2:'#ffc233', C3:'#ff9a1f', C4:'#ff5f2e', C5:'#e0245e' };
const DEPTH = { shallow:'#ff4d4d', inter:'#ffb000', deep:'#4da3ff' };
const PLATE = { constructive:'#3ddc97', destructive:'#ff5c5c', collision:'#c77dff', conservative:'#ffd166' };
const PLATE_TEXT = {
  constructive: 'Constructive: plates move apart and magma rises to fill the gap',
  destructive: 'Destructive: an oceanic plate sinks (subducts) under another plate',
  collision: 'Collision: two continental plates push together and form fold mountains',
  conservative: 'Conservative: plates slide past each other',
};
const STAGE_COLOR = ['match',['get','stage'],'TD',COLORS.TD,'TS',COLORS.TS,'HU',COLORS.C3,'#cccccc'];
const GIBS = 'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best';
const USGS_FEED = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson';
const dayStr = (daysAgo) => new Date(Date.now() - daysAgo * 864e5).toISOString().slice(0, 10);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FC = (features = []) => ({ type: 'FeatureCollection', features });
const pt = (lon, lat, properties = {}) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [lon, lat] }, properties });
const latStr = (lat) => `${Math.abs(lat).toFixed(1)}°${lat >= 0 ? 'N' : 'S'}`;
const lonStr = (lon) => `${Math.abs(lon).toFixed(1)}°${lon >= 0 ? 'E' : 'W'}`;
const fmtDate = (s, withYear) => s ? new Date(/Z|[+-]\d\d:?\d\d$/.test(s) ? s : s + 'Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', ...(withYear ? { year: 'numeric' } : {}) }) : '–';
const fmtDateTime = (ms) => new Date(ms).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC';
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const depthClass = (d) => d < 70 ? 'shallow' : d < 300 ? 'inter' : 'deep';
const DEPTH_LABEL = { shallow: 'Shallow (0–70 km)', inter: 'Intermediate (70–300 km)', deep: 'Deep (300 km+)' };
function ago(ms) {
  const m = Math.round((Date.now() - ms) / 6e4);
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}
function distKm(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

// ================= State =================
const state = {
  mode: 'live', liveTab: 'storms',
  storms: [], quakes: [], plates: null, cases: null,
  selected: null,          // { kind: 'storm'|'quake', id }
  caseSel: null,           // case study object with .kind
  play: { on: false, t: 0, speed: 1 },
};

// ================= Map =================
const map = new maplibregl.Map({
  container: 'map', center: [-40, 20], zoom: 1.6, minZoom: 0.8, maxZoom: 9,
  attributionControl: { compact: true },
  style: {
    version: 8,
    projection: { type: 'globe' },
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    sky: { 'atmosphere-blend': ['interpolate', ['linear'], ['zoom'], 0, 1, 5, 1, 7, 0] },
    sources: {
      earth: { type: 'raster', tileSize: 256, maxzoom: 8,
        tiles: [`${GIBS}/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/{z}/{y}/{x}.jpeg`],
        attribution: 'Imagery: NASA GIBS · Storms: <a href="https://www.gdacs.org" target="_blank">GDACS</a>, <a href="https://www.ncei.noaa.gov/products/international-best-track-archive" target="_blank">IBTrACS</a> · Earthquakes: <a href="https://earthquake.usgs.gov" target="_blank">USGS</a> · Plates: Bird (2003)' },
      sat: { type: 'raster', tileSize: 256, maxzoom: 9,
        tiles: [`${GIBS}/MODIS_Terra_CorrectedReflectance_TrueColor/default/${dayStr(1)}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg`] },
      sst: { type: 'raster', tileSize: 256, maxzoom: 7,
        tiles: [`${GIBS}/GHRSST_L4_MUR_Sea_Surface_Temperature/default/${dayStr(2)}/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png`] },
    },
    layers: [
      { id: 'bg', type: 'background', paint: { 'background-color': '#000' } },
      { id: 'earth', type: 'raster', source: 'earth' },
      { id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } },
      { id: 'sst', type: 'raster', source: 'sst', layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.8 } },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
// On small screens, start with the credits folded into the (i) button
map.once('load', () => setTimeout(() => { if (window.matchMedia('(max-width: 1099px)').matches) document.querySelector('.maplibregl-ctrl-attrib')?.classList.remove('maplibregl-compact-show'); }, 300));

// ----- Icons drawn on canvas -----
function cycloneIcon(color, southern) {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.translate(s / 2, s / 2);
  if (southern) g.scale(-1, 1);
  g.strokeStyle = color; g.fillStyle = color; g.lineCap = 'round';
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 4;
  for (const rot of [0, Math.PI]) {
    g.save(); g.rotate(rot);
    g.beginPath(); g.lineWidth = 6; g.arc(0, 0, 13, Math.PI * 0.05, Math.PI * 0.95); g.stroke();
    g.beginPath(); g.lineWidth = 5; g.moveTo(-13, 2); g.quadraticCurveTo(-16, 20, -2, 27); g.stroke();
    g.restore();
  }
  g.beginPath(); g.arc(0, 0, 7, 0, Math.PI * 2); g.fill();
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(0, 0, 3.5, 0, Math.PI * 2); g.fill();
  return g.getImageData(0, 0, s, s);
}
function volcanoIcon() {
  const s = 64, c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 5;
  g.fillStyle = '#6b4a3a';
  g.beginPath(); g.moveTo(8, 56); g.lineTo(26, 20); g.lineTo(38, 20); g.lineTo(56, 56); g.closePath(); g.fill();
  g.fillStyle = '#ff5a1f';
  g.beginPath(); g.moveTo(26, 20); g.lineTo(38, 20); g.lineTo(35, 30); g.lineTo(32, 26); g.lineTo(29, 31); g.closePath(); g.fill();
  g.fillStyle = 'rgba(200,200,200,.85)';
  for (const [x, y, r] of [[30, 12, 6], [38, 8, 5], [24, 7, 4]]) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  return g.getImageData(0, 0, s, s);
}

// ----- Sun, night and reference lines -----
function sunPosition(date) {
  const d = (date - Date.UTC(2000, 0, 1, 12)) / 864e5;
  const g = (357.529 + 0.98560028 * d) * Math.PI / 180;
  const q = 280.459 + 0.98564736 * d;
  const L = (q + 1.915 * Math.sin(g) + 0.020 * Math.sin(2 * g)) * Math.PI / 180;
  const e = (23.439 - 0.00000036 * d) * Math.PI / 180;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const ra = Math.atan2(Math.cos(e) * Math.sin(L), Math.cos(L));
  const gmst = (18.697374558 + 24.06570982441908 * d) % 24;
  let lon = (ra * 180 / Math.PI - gmst * 15) % 360;
  if (lon < -180) lon += 360; if (lon > 180) lon -= 360;
  return { lat: dec * 180 / Math.PI, lon };
}
function nightGeoJSON(now = new Date()) {
  const sun = sunPosition(now);
  const dec = Math.max(Math.abs(sun.lat), 0.01) * Math.sign(sun.lat || 1) * Math.PI / 180;
  const ring = [];
  for (let lon = -180; lon <= 180; lon += 2) {
    const ha = (lon - sun.lon) * Math.PI / 180;
    const lat = Math.atan(-Math.cos(ha) / Math.tan(dec)) * 180 / Math.PI;
    ring.push([lon, Math.max(-84.9, Math.min(84.9, lat))]); // stay inside the pole cap so the ring never crosses itself
  }
  const pole = dec > 0 ? -85 : 85;
  ring.push([180, pole], [-180, pole], ring[0]);
  return FC([
    { type: 'Feature', properties: { kind: 'night' }, geometry: { type: 'Polygon', coordinates: [ring] } },
    pt(sun.lon, sun.lat, { kind: 'sun' }),
  ]);
}
function refLines() {
  const line = (lat, label, kind) => ({ type: 'Feature', properties: { label, kind },
    geometry: { type: 'LineString', coordinates: Array.from({ length: 73 }, (_, i) => [-180 + i * 5, lat]) } });
  return FC([
    line(0, 'Equator', 'eq'),
    line(23.44, 'Tropic of Cancer', 'tropic'), line(-23.44, 'Tropic of Capricorn', 'tropic'),
    line(5, '5°N: too little Coriolis force for storms', 'five'), line(-5, '5°S', 'five'),
  ]);
}

// ================= Data loading =================
async function loadStatic() {
  try {
    state.plates = await (await fetch('./data/plates.json')).json();
    map.getSource('plates').setData(state.plates);
  } catch (e) { console.warn('Plates not loaded', e); }
  try {
    state.cases = await (await fetch('./data/casestudies.json')).json();
    if (state.mode === 'cases') renderList();
  } catch (e) { console.warn('Case studies not loaded', e); }
}

async function fetchStorms() {
  const api = new URLSearchParams(location.search).get('api') || './api/storms';
  try {
    const r = await fetch(api, { cache: 'no-store' });
    if (r.ok) return await r.json();
  } catch (e) { /* fall through */ }
  return await loadStorms();
}

async function refreshStorms() {
  try {
    const data = await fetchStorms();
    state.storms = data.storms || [];
    $('updated').textContent = `Updated ${new Date(data.generated).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })} · GDACS and USGS`;
    $('banner').classList.remove('show');
  } catch (e) {
    console.error(e);
    $('banner').innerHTML = '<b>Couldn’t load live storm data.</b> Storms need the small data service at <code>/api/storms</code>, so run the site from Vercel rather than opening the file. Earthquakes and case studies still work.';
    $('banner').classList.add('show');
    setTimeout(() => $('banner').classList.remove('show'), 9000);
  }
  renderLive();
}

async function refreshQuakes() {
  try {
    const r = await fetch(USGS_FEED, { cache: 'no-store' });
    const data = await r.json();
    state.quakes = data.features.map((f) => ({
      id: f.id, mag: Math.round(f.properties.mag * 10) / 10, place: f.properties.place || 'Unknown location',
      time: f.properties.time, lon: f.geometry.coordinates[0], lat: f.geometry.coordinates[1],
      depth: Math.round(f.geometry.coordinates[2]), tsunami: f.properties.tsunami, url: f.properties.url,
      felt: f.properties.felt, alert: f.properties.alert,
    })).sort((a, b) => b.mag - a.mag);
  } catch (e) { console.error('USGS feed failed', e); }
  renderLive();
}

// ================= Live rendering =================
function renderLive() {
  if (!map.getSource('storms')) return;
  const sel = state.selected;
  const isSel = (kind, id) => !!(sel && sel.kind === kind && sel.id === id);
  const S = state.storms;
  map.getSource('storms').setData(FC(S.map((s) => pt(s.lon, s.lat, {
    id: s.id, name: s.name, color: COLORS[s.category.code], icon: `cy-${s.category.code}-${s.lat >= 0 ? 'n' : 's'}`, spin: s.lat >= 0 ? -1 : 1 }))));
  map.getSource('tracks').setData(FC(S.flatMap((s) => (s.track || []).map((t) => ({
    type: 'Feature', geometry: { type: 'LineString', coordinates: t.coords }, properties: { stage: t.stage, forecast: t.forecast, sel: isSel('storm', s.id) } })))));
  map.getSource('points').setData(FC(S.flatMap((s) => (s.points || []).map((p) => pt(p.c[0], p.c[1], { forecast: p.forecast })))));
  map.getSource('cones').setData(FC(S.filter((s) => s.cone).map((s) => ({ type: 'Feature', geometry: s.cone, properties: { sel: isSel('storm', s.id) } }))));
  const now = Date.now();
  map.getSource('quakes').setData(FC([...state.quakes].reverse().map((q) => pt(q.lon, q.lat, {
    id: q.id, mag: q.mag, dc: depthClass(q.depth), ageH: (now - q.time) / 36e5, sel: isSel('quake', q.id) }))));

  $('sStorms').textContent = S.length;
  $('sQuakes').textContent = state.quakes.length || '–';
  $('sBig').textContent = state.quakes[0] ? 'M' + state.quakes[0].mag.toFixed(1) : '–';
  if (state.mode === 'live') renderList();
  if (sel && state.mode === 'live') showLiveCard();
}

function renderList() {
  updateSheetText();
  const list = $('listBody');
  if (state.mode === 'cases') { renderCaseList(); return; }
  const t = state.liveTab;
  let html = `<div class="tabs"><button data-tab="storms" class="${t === 'storms' ? 'on' : ''}">Storms (${state.storms.length})</button><button data-tab="quakes" class="${t === 'quakes' ? 'on' : ''}">Earthquakes (${state.quakes.length})</button></div>`;
  const sel = state.selected;
  if (t === 'storms') {
    html += state.storms.length ? state.storms.map((s) => `
      <div class="item ${sel?.id === s.id ? 'active' : ''}" data-kind="storm" data-id="${esc(s.id)}">
        <div class="badge" style="background:${COLORS[s.category.code]}">${esc(s.category.short)}</div>
        <div><div class="nm">${esc(s.name)}</div><div class="meta">${esc(s.basin.name)} · ${s.windKmh} km/h</div></div>
      </div>`).join('') : '<div class="empty">No active tropical storms right now. Quiet spells are normal, especially outside each basin’s season.</div>';
  } else {
    html += state.quakes.length ? state.quakes.slice(0, 80).map((q) => `
      <div class="item ${sel?.id === q.id ? 'active' : ''}" data-kind="quake" data-id="${esc(q.id)}">
        <div class="badge" style="background:${DEPTH[depthClass(q.depth)]}">${q.mag.toFixed(1)}</div>
        <div><div class="nm">${esc(q.place)}</div><div class="meta">${ago(q.time)} · ${q.depth} km deep</div></div>
      </div>`).join('') : '<div class="empty">Loading earthquakes…</div>';
  }
  list.innerHTML = html;
  list.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => { state.liveTab = b.dataset.tab; renderList(); });
  list.querySelectorAll('.item').forEach((el) => el.onclick = () => selectLive(el.dataset.kind, el.dataset.id, true));
}

function selectLive(kind, id, fly) {
  state.selected = { kind, id };
  if (state.selected.id !== state.lastCardId) state.cardPeek = isCompact();
  sheet(false);
  state.liveTab = kind === 'storm' ? 'storms' : 'quakes';
  stopSpin();
  renderLive();
  const o = kind === 'storm' ? state.storms.find((s) => s.id === id) : state.quakes.find((q) => q.id === id);
  if (o && fly) map.flyTo({ center: [o.lon, o.lat], zoom: Math.max(map.getZoom(), kind === 'storm' ? 3.4 : 3), speed: 0.8 });
}

// ---------- Compact (phone/tablet) layout helpers ----------
const compactMQ = window.matchMedia('(max-width: 1099px)');
const isCompact = () => compactMQ.matches;
function sheet(open) {
  $('list').classList.toggle('open', open);
  $('sheetHandle').setAttribute('aria-expanded', open);
}
$('sheetHandle').onclick = () => sheet(!$('list').classList.contains('open'));
function updateSheetText() {
  $('sheetText').textContent = state.mode === 'live'
    ? `${state.storms.length} storms · ${state.quakes.length} earthquakes`
    : `${state.cases ? allCases().length : ''} case studies`;
}
// Keep the replay bar just above whichever sheet is showing
const syncSheetH = () => {
  const el = document.body.classList.contains('carded') ? $('card') : $('list');
  document.documentElement.style.setProperty('--sheetH', (el.offsetHeight || 56) + 'px');
};
new ResizeObserver(syncSheetH).observe($('card'));
new ResizeObserver(syncSheetH).observe($('list'));
compactMQ.addEventListener('change', () => { $('card').classList.toggle('peek', isCompact() && state.cardPeek); syncSheetH(); });

// Split the card into an always-visible head and a body that folds away on small screens
function finishCard() {
  const card = $('card');
  const head = document.createElement('div'), body = document.createElement('div');
  head.className = 'chead'; body.className = 'cbody';
  for (const n of [...card.childNodes]) {
    const keep = n.nodeType === 1 && (n.matches('.close, .badge, h2') || n.id === 'csNow' || (n.matches('.sub') && !head.querySelector('.sub')));
    (keep ? head : body).append(n);
  }
  const more = document.createElement('button');
  more.className = 'more';
  head.append(more);
  card.append(head, body);
  const setPeek = (p) => { state.cardPeek = p; card.classList.toggle('peek', isCompact() && p); more.textContent = p ? 'Show details ▲' : 'Hide details ▼'; };
  setPeek(state.cardPeek);
  head.onclick = (e) => { if (!isCompact() || e.target.closest('.close, a')) return; setPeek(!state.cardPeek); };
  card.querySelector('.close').onclick = (e) => { e.stopPropagation(); closeCard(); };
  state.lastCardId = state.selected?.id || state.caseSel?.id;
  card.classList.add('show');
  document.body.classList.add('carded');
  if (state.caseSel) drawCase();
  syncSheetH();
}

function closeCard() {
  state.lastCardId = null;
  document.body.classList.remove('carded');
  state.selected = null;
  $('card').classList.remove('show');
  if (state.mode === 'live') renderLive(); else clearCase();
  syncSheetH();
}

function nearestBoundary(lon, lat) {
  if (!state.plates) return null;
  let best = null;
  for (const f of state.plates.features) {
    for (const c of f.geometry.coordinates) {
      if (Math.abs(c[1] - lat) > 12) continue;
      const d = distKm([lon, lat], c);
      if (!best || d < best.d) best = { d, type: f.properties.type };
    }
  }
  return best;
}

        <div><small>Active since</small><b>${fmtDate(s.from)}</b><br><small>${days} day${days > 1 ? 's' : ''}</small></div>
        <div><small>GDACS alert</small><b>${esc(s.alert)}</b><br><small>humanitarian impact</small></div>
      </div>
      <div class="teach">This is ${catText}. In the ${esc(s.basin.name)}, storms like this are called <b>${s.basin.term}s</b>.</div>
      <div class="teach">It spins <b>${north ? 'anticlockwise' : 'clockwise'}</b> because it is in the ${north ? 'Northern' : 'Southern'} Hemisphere. The Coriolis effect turns the inflowing air.</div>
      <div class="q"><b style="color:var(--text)">Discuss</b><ol>${questions.map((q) => `<li>${q}</li>`).join('')}</ol></div>
      <div class="src">Solid line: where it has been. Dashed line and white cone: where forecasters expect it to go. ${s.report ? `<a href="${esc(s.report)}" target="_blank" rel="noopener">Full GDACS report</a>` : ''}</div>`;
  } else {
    const q = state.quakes.find((x) => x.id === sel.id);
    if (!q) return card.classList.remove('show');
    const dc = depthClass(q.depth);
    const nb = nearestBoundary(q.lon, q.lat);
    const nbText = nb ? (nb.d < 250
      ? `It is about <b>${Math.round(nb.d / 10) * 10} km</b> from a <b style="color:${PLATE[nb.type]}">${nb.type}</b> plate boundary. ${PLATE_TEXT[nb.type]}.`
      : `It is about ${Math.round(nb.d / 50) * 50} km from the nearest plate boundary, so it is an unusual <b>intraplate</b> earthquake.`) : '';
    const questions = [
      dc === 'deep' || dc === 'inter'
        ? `It happened ${q.depth} km down. Only one type of plate boundary produces earthquakes this deep. Which one, and why?`
        : `Shallow earthquakes usually cause more damage than deep ones of the same magnitude. Why?`,
      `Look at the other earthquakes this week. Do they form a pattern? How does it compare with the plate boundaries?`,
      `What would the impacts of a magnitude ${q.mag.toFixed(1)} earthquake here depend on?`,
    ];
    card.innerHTML = `
      <button class="close" aria-label="Close">×</button>
      <div class="badge" style="background:${DEPTH[dc]}">${q.mag.toFixed(1)}</div>
      <h2>Magnitude ${q.mag.toFixed(1)}</h2>
      <div class="sub">${esc(q.place)}</div>
      <div class="kv">
        <div><small>When</small><b>${ago(q.time)}</b><br><small>${fmtDateTime(q.time)}</small></div>
        <div><small>Depth</small><b>${q.depth} km</b><br><small>${DEPTH_LABEL[dc]}</small></div>
        <div><small>Location</small><b>${latStr(q.lat)}</b><br><small>${lonStr(q.lon)}</small></div>
        <div><small>Tsunami</small><b>${q.tsunami ? 'Alert issued' : 'None flagged'}</b><br><small>by USGS</small></div>
      </div>
      ${nbText ? `<div class="teach">${nbText}</div>` : ''}
      <div class="q"><b style="color:var(--text)">Discuss</b><ol>${questions.map((x) => `<li>${x}</li>`).join('')}</ol></div>
      <div class="src"><a href="${esc(q.url)}" target="_blank" rel="noopener">USGS event page</a> · Magnitude is logarithmic: each whole number is about 32 times more energy.</div>`;
  }
  finishCard();
}

// ================= Case studies =================
function caseBadge(c) {
  if (c.kind === 'storm') {
    const peak = Math.max(...c.track.map((p) => p[3] || 0));
    const cat = category(peak * 1.852);
    return `<div class="badge" style="background:${COLORS[cat.code]}">${esc(cat.short)}</div>`;
  }
  if (c.kind === 'quake') return `<div class="badge" style="background:${DEPTH.shallow}">${c.mag.toFixed(1)}</div>`;
  return `<div class="badge tri" style="background:#ff7a3d">V</div>`;
}

function allCases() {
  const C = state.cases;
  if (!C) return [];
  return [
    ...C.storms.map((c) => ({ ...c, kind: 'storm' })),
    ...C.earthquakes.map((c) => ({ ...c, kind: 'quake' })),
    ...C.volcanoes.map((c) => ({ ...c, kind: 'volcano' })),
  ];
}

function renderCaseList() {
  const list = $('listBody');
  if (!state.cases) { list.innerHTML = '<div class="empty">Loading case studies…</div>'; return; }
  const cases = allCases();
  const group = (kind, title) => `<div class="group">${title}</div>` + cases.filter((c) => c.kind === kind).sort((a, b) => b.year - a.year).map((c) => `
    <div class="item ${state.caseSel?.id === c.id ? 'active' : ''}" data-id="${esc(c.id)}">
      ${caseBadge(c)}
      <div><div class="nm">${esc(c.name)}</div><div class="meta">${c.year} · ${esc(c.dev)}</div></div>
    </div>`).join('');
  list.innerHTML = group('storm', 'Tropical storms: replay the track') + group('quake', 'Earthquakes: replay the aftershocks') + group('volcano', 'Volcanoes');
  list.querySelectorAll('.item').forEach((el) => el.onclick = () => openCase(cases.find((c) => c.id === el.dataset.id)));
}

function clearCase() {
  state.caseSel = null;
  pause();
  $('player').classList.remove('show');
  document.body.classList.remove('playing');
  for (const id of ['cs-track', 'cs-trail', 'cs-points', 'cs-quakes', 'cs-main', 'cs-marker']) map.getSource(id)?.setData(FC());
  renderCaseList();
}

function openCase(c) {
  clearCase();
  state.caseSel = c;
  state.cardPeek = isCompact();
  sheet(false);
  stopSpin();
  renderCaseList();
  if (c.kind === 'storm') {
    const pts = c.track;
    c._t = pts.map((p) => Date.parse(p[0] + ':00:00Z'));
    c._span = c._t[c._t.length - 1] - c._t[0];
    map.getSource('cs-track').setData(FC([{ type: 'Feature', geometry: { type: 'LineString', coordinates: pts.map((p) => [p[2], p[1]]) }, properties: {} }]));
    const landfalls = pts.filter((p, i) => p[5] && !(pts[i - 1] || [])[5]);
    map.getSource('cs-points').setData(FC(landfalls.map((p) => pt(p[2], p[1], { t: p[0] }))));
    fitTo(pts.map((p) => [p[2], p[1]]));
  } else if (c.kind === 'quake') {
    c._span = Math.max(60, ...c.seq.map((s) => s[0]));
    map.flyTo({ center: [c.lon, c.lat], zoom: c.mag >= 8.5 ? 4.2 : 5.2, speed: 0.9 });
  } else {
    map.getSource('cs-marker').setData(FC([pt(c.lon, c.lat, { kind: 'volcano', label: c.name })]));
    map.flyTo({ center: [c.lon, c.lat], zoom: 5, speed: 0.9 });
  }
  const hasReplay = c.kind !== 'volcano';
  $('player').classList.toggle('show', hasReplay);
  document.body.classList.toggle('playing', hasReplay);
  state.play.t = 0;
  $('pSlider').value = 0;
  drawCase();
  showCaseCard();
  if (hasReplay) setTimeout(play, 1200);
}

function fitTo(coords) {
  let [minX, minY, maxX, maxY] = [180, 90, -180, -90];
  for (const [x, y] of coords) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  const W = window.innerWidth, H = window.innerHeight;
  const padding = !isCompact() ? { top: 80, bottom: 120, left: 380, right: 400 }
    : W >= 700 ? { top: 80, bottom: 90, left: 430, right: 40 }          // tablet: card on the left
    : { top: 80, bottom: Math.round(H * 0.4), left: 30, right: 30 };  // phone: card along the bottom
  try { map.fitBounds([[minX, minY], [maxX, maxY]], { padding, maxZoom: 5, duration: 1500 }); }
  catch (e) { map.flyTo({ center: [(minX + maxX) / 2, (minY + maxY) / 2], zoom: 3 }); }
}

// Interpolated state of a storm at fraction f (0..1) of its life
function stormAt(c, f) {
  const T = c._t[0] + f * c._span, P = c.track;
  let i = 0;
  while (i < P.length - 2 && c._t[i + 1] <= T) i++;
  const a = P[i], b = P[i + 1] || a;
  const k = c._t[i + 1] > c._t[i] ? Math.min(1, Math.max(0, (T - c._t[i]) / (c._t[i + 1] - c._t[i]))) : 0;
  const lerp = (x, y) => x == null ? y : y == null ? x : x + (y - x) * k;
  return { i, time: T, lat: lerp(a[1], b[1]), lon: lerp(a[2], b[2]), kt: lerp(a[3], b[3]), pres: lerp(a[4], b[4]), land: (k < 0.5 ? a : b)[5] };
}

function drawCase() {
  const c = state.caseSel;
  if (!c) return;
  const f = state.play.t;
  if (c.kind === 'storm') {
    const s = stormAt(c, f);
    const P = c.track, segs = [];
    for (let j = 0; j <= s.i && j < P.length - 1; j++) {
      const end = j === s.i ? [s.lon, s.lat] : [P[j + 1][2], P[j + 1][1]];
      segs.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[P[j][2], P[j][1]], end] },
        properties: { color: COLORS[category((P[j][3] || 0) * 1.852).code] } });
    }
    map.getSource('cs-trail').setData(FC(segs));
    const cat = category((s.kt || 0) * 1.852);
    map.getSource('cs-marker').setData(FC([pt(s.lon, s.lat, { kind: 'storm', icon: `cy-${cat.code}-${s.lat >= 0 ? 'n' : 's'}`, spin: s.lat >= 0 ? -1 : 1, label: c.name.split(' ').pop() })]));
    const kmh = Math.round((s.kt || 0) * 1.852);
    $('pTime').innerHTML = `<b>${fmtDateTime(s.time).replace(' UTC', '')}</b><br><small>${cat.label} · ${kmh} km/h · ${s.land ? 'over land' : 'over sea'}</small>`;
    const now = document.getElementById('csNow');
    if (now) now.innerHTML = `<b style="color:${COLORS[cat.code]}">${cat.label}</b> · ${kmh} km/h (${Math.round(kmh / 1.609)} mph)${s.pres ? ` · ${Math.round(s.pres)} hPa` : ''} · ${s.land ? '<b>over land</b>' : 'over the ocean'}`;
  } else if (c.kind === 'quake') {
    const tMin = f * c._span;
    const shown = c.seq.filter((q) => q[0] <= tMin && q[0] !== 0);
    map.getSource('cs-quakes').setData(FC(shown.map((q) => pt(q[2], q[1], {
      mag: q[3], dc: depthClass(q[4]), fresh: Math.max(0, 1 - (tMin - q[0]) / (c._span * 0.04 + 30)) }))));
    const ringR = state.play.on || f < 0.02 ? ((performance.now() / 12) % 90) : 0;
    map.getSource('cs-main').setData(FC([
      pt(c.lon, c.lat, { kind: 'main', mag: c.mag }),
      ...(f < 0.08 ? [pt(c.lon, c.lat, { kind: 'ring', r: 12 + ringR, o: 1 - ringR / 90 })] : []),
    ]));
    const d = Math.floor(tMin / 1440), h = Math.floor((tMin % 1440) / 60);
    const big = shown.filter((q) => q[3] >= 6).length;
    $('pTime').innerHTML = `<b>${d ? `Day ${d + 1}, ` : ''}${h} h after main shock</b><br><small>${shown.length} aftershocks shown${big ? ` · ${big} of M6+` : ''}</small>`;
    const now = document.getElementById('csNow');
    if (now) now.innerHTML = `<b>${shown.length}</b> aftershocks so far · largest M${shown.length ? Math.max(...shown.map((q) => q[3])).toFixed(1) : '–'}`;
  }
}

function showCaseCard() {
  const c = state.caseSel;
  const card = $('card');
  const W = (url, text) => `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>`;
  let head = '', kv = '', teach = '', qs = [];
  if (c.kind === 'storm') {
    const peak = Math.max(...c.track.map((p) => p[3] || 0));
    const cat = category(peak * 1.852);
    const minP = Math.min(...c.track.map((p) => p[4] || 9999));
    const north = c.track[0][1] >= 0;
    head = `<div class="badge" style="background:${COLORS[cat.code]}">${esc(cat.short)}</div>`;
    kv = `<div><small>Peak wind</small><b>${Math.round(peak * 1.852)} km/h</b><br><small>${Math.round(peak * 1.15)} mph · ${esc(cat.label)}</small></div>
          <div><small>Lowest pressure</small><b>${minP < 9999 ? minP + ' hPa' : '–'}</b><br><small>lower = stronger</small></div>
          <div><small>Lifetime</small><b>${Math.round(c._span / 864e5)} days</b><br><small>${fmtDate(c.track[0][0] + ':00', true)}</small></div>
          <div><small>Development</small><b>${esc(c.dev)}</b></div>`;
    teach = `<div class="teach" id="csNow"></div>`;
    qs = [
      'Pause the replay at landfall. What happens to the wind speed once it is over land, and why?',
      `Where did it form? Why ${north ? 'north' : 'south'} of the Equator but not right on it?`,
      c.dev.includes('LIC') || c.dev.includes('NEE') ? 'Compare this with Hurricane Katrina (USA, HIC). Why were the impacts so different?' : 'Compare this with Cyclone Nargis or Typhoon Haiyan. Why were the death tolls so different?',
    ];
  } else if (c.kind === 'quake') {
    head = `<div class="badge" style="background:${DEPTH.shallow}">${c.mag.toFixed(1)}</div>`;
    kv = `<div><small>Magnitude</small><b>${c.mag.toFixed(1)}</b></div>
          <div><small>Depth</small><b>${Math.round(c.depth)} km</b><br><small>${DEPTH_LABEL[depthClass(c.depth)]}</small></div>
          <div><small>Date</small><b>${fmtDate(c.time, true)}</b></div>
          <div><small>Development</small><b>${esc(c.dev)}</b></div>`;
    teach = `<div class="teach"><b style="color:${PLATE[c.boundary]}">${c.boundary[0].toUpperCase() + c.boundary.slice(1)} boundary.</b> ${esc(cap(c.boundaryText.replace(/^[A-Z][a-z]+: /, '')))}.</div><div class="teach" id="csNow"></div>`;
    qs = [
      'Watch the aftershocks appear. What shape do they make, and what does that tell you about the fault?',
      c.id === 'haiti-2010' || c.id === 'chile-2010' ? 'Chile’s earthquake was about 500 times more powerful than Haiti’s, yet far fewer people died. Explain why.' : 'How did the level of development affect the impacts and the response?',
      'Which impacts were primary (caused by the shaking) and which were secondary?',
    ];
  } else {
    head = `<div class="badge tri" style="background:#ff7a3d">V</div>`;
    kv = `<div><small>Eruption</small><b>${esc(c.date)}</b></div>
          <div><small>Location</small><b>${latStr(c.lat)}</b><br><small>${lonStr(c.lon)}</small></div>
          <div><small>Plate boundary</small><b style="color:${PLATE[c.boundary]}">${esc(c.boundary)}</b></div>
          <div><small>Development</small><b>${esc(c.dev)}</b></div>`;
    teach = `<div class="teach">${esc(c.boundaryText)}.</div>`;
    qs = [
      c.boundary === 'constructive' ? 'Volcanoes at constructive boundaries usually have runny basaltic lava. How does that change the hazard?' : 'Volcanoes at destructive boundaries are often very explosive. Why?',
      'Turn on plate boundaries. Which other volcanoes or earthquakes in the case studies sit on the same type of boundary?',
      'Why do people continue to live near active volcanoes?',
    ];
  }
  card.innerHTML = `
    <button class="close" aria-label="Close">×</button>
    ${head}
    <h2>${esc(c.name)}</h2>
    <div class="sub">${esc(c.where)} · ${c.year}</div>
    ${c.summary ? `<div class="sub" style="color:var(--text);font-size:13.5px;margin-top:8px">${esc(c.summary)}</div>` : ''}
    <div class="kv">${kv}</div>
    ${teach}
    <b style="font-size:13px">Key facts</b>
    <ul class="facts">${c.facts.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
    <div class="q"><b style="color:var(--text)">Discuss</b><ol>${qs.map((x) => `<li>${x}</li>`).join('')}</ol></div>
    <div class="src">${W(c.wiki, 'Read more')}${c.usgs ? ' · ' + W(c.usgs, 'USGS event page') : ''}${c.source ? `<br>${esc(c.source)}` : ''}<br>Figures are rounded, widely cited estimates.</div>`;
  finishCard();
  drawCase();
}

// ----- Player -----
function play() {
  if (!state.caseSel || state.caseSel.kind === 'volcano') return;
  if (state.play.t >= 1) state.play.t = 0;
  state.play.on = true;
  $('pPlay').textContent = '❚❚';
}
function pause() { state.play.on = false; $('pPlay').textContent = '▶'; }
$('pPlay').onclick = () => (state.play.on ? pause() : play());
$('pSlider').oninput = (e) => { pause(); state.play.t = e.target.value / 1000; drawCase(); };
$('pSpeed').onchange = (e) => (state.play.speed = +e.target.value);

// ================= Animation loop =================
let spinning = true, userBusy = false;
function stopSpin() { spinning = false; $('tSpin').checked = false; }
map.on('mousedown', () => (userBusy = true));
map.on('touchstart', () => (userBusy = true));
map.on('mouseup', () => (userBusy = false));
map.on('touchend', () => (userBusy = false));
map.on('dragstart', stopSpin);

function animate() {
  let last = performance.now(), angle = 0, acc = 0;
  const REPLAY_SECONDS = 24; // a whole case study at 1x
  const tick = (t) => {
    const dt = t - last; last = t; acc += dt;
    if (state.play.on) {
      state.play.t = Math.min(1, state.play.t + (dt / 1000) * state.play.speed / REPLAY_SECONDS);
      if (state.play.t >= 1) pause();
    }
    if (acc > 50) {
      angle = (angle + acc * 0.12) % 360; acc = 0;
      const rot = ['*', ['get', 'spin'], angle];
      if (map.getLayer('storms')) map.setLayoutProperty('storms', 'icon-rotate', rot);
      if (map.getLayer('cs-storm')) map.setLayoutProperty('cs-storm', 'icon-rotate', rot);
      if (state.caseSel && state.caseSel.kind !== 'volcano' && (state.play.on || state.play.t < 0.08)) {
        drawCase();
        $('pSlider').value = Math.round(state.play.t * 1000);
      }
      if (spinning && !userBusy && !map.isMoving()) {
        const c = map.getCenter();
        map.jumpTo({ center: [c.lng + 0.06, c.lat] });
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// ================= Modes, legend and controls =================
function applyLiveVisibility() {
  const live = state.mode === 'live';
  vis(LIVE_STORM_LAYERS, live && $('tStorms').checked);
  vis(['cones', 'cones-edge'], live && $('tStorms').checked && $('tCone').checked);
  vis(LIVE_QUAKE_LAYERS, live && $('tQuakes').checked);
  vis(['basins'], live);
  vis(CASE_LAYERS, !live);
}

function setMode(mode) {
  state.mode = mode;
  document.body.classList.toggle('cases', mode === 'cases');
  $('mLive').classList.toggle('on', mode === 'live');
  $('mCases').classList.toggle('on', mode === 'cases');
  $('stats').style.display = mode === 'live' ? '' : 'none';
  $('updated').style.display = mode === 'live' ? '' : 'none';
  $('subtitle').textContent = mode === 'live'
    ? 'Tropical storms and earthquakes happening around the world right now.'
    : 'Replay famous tropical storms and earthquakes, and explore key volcanic eruptions.';
  $('card').classList.remove('show');
  document.body.classList.remove('carded');
  state.selected = null;
  if (mode === 'live') { clearCase(); renderLive(); } else { renderList(); }
  if (isCompact()) sheet(mode === 'cases');
  $('controls').open = false;
  syncSheetH();
  applyLiveVisibility();
  renderLegend();
}
$('mLive').onclick = () => setMode('live');
$('mCases').onclick = () => setMode('cases');

function renderLegend() {
  const dot = (c) => `<i style="background:${c}"></i>`;
  const ln = (c) => `<i class="ln" style="background:${c}"></i>`;
  const rows = [];
  const showStorms = state.mode === 'cases' || $('tStorms').checked;
  const showQuakes = state.mode === 'cases' || $('tQuakes').checked;
  if (showStorms) rows.push(`<div class="row"><b>Storms</b><span>${dot(COLORS.TD)}Depression</span><span>${dot(COLORS.TS)}Storm</span><span>${dot(COLORS.C1)}Cat 1</span><span>${dot(COLORS.C2)}2</span><span>${dot(COLORS.C3)}3</span><span>${dot(COLORS.C4)}4</span><span>${dot(COLORS.C5)}5</span></div>`);
  if (showQuakes) rows.push(`<div class="row"><b>Quake depth</b><span>${dot(DEPTH.shallow)}0–70 km</span><span>${dot(DEPTH.inter)}70–300 km</span><span>${dot(DEPTH.deep)}300 km+</span><span style="color:var(--muted)">bigger circle = bigger magnitude</span></div>`);
  if ($('tPlates').checked) rows.push(`<div class="row"><b>Plates</b><span>${ln(PLATE.constructive)}Constructive</span><span>${ln(PLATE.destructive)}Destructive</span><span>${ln(PLATE.collision)}Collision</span><span>${ln(PLATE.conservative)}Conservative</span></div>`);
  if ($('tSst').checked) rows.push(`<div class="row"><b>Sea temp</b><span style="display:inline-block;width:160px;height:8px;border-radius:4px;background:linear-gradient(90deg,#2b1a6b,#1e58c9,#15b3c6,#6fe07a,#f4e53a,#f28a1c,#c81d1d)"></span><span style="color:var(--muted)">cooler → warmer</span></div>`);
  $('legend').innerHTML = rows.join('');
  $('controlsLegend').innerHTML = rows.join('');
  $('legend').style.display = rows.length ? '' : 'none';
}

$('tStorms').onchange = () => { applyLiveVisibility(); renderLegend(); };
$('tQuakes').onchange = () => { applyLiveVisibility(); renderLegend(); };
$('tCone').onchange = () => applyLiveVisibility();
$('tPlates').onchange = (e) => { vis(['plates'], e.target.checked); renderLegend(); };
$('tNight').onchange = (e) => vis(['night', 'sun'], e.target.checked);
$('tLines').onchange = (e) => vis(['ref', 'ref-dash', 'ref-label'], e.target.checked);
$('tSst').onchange = (e) => { vis(['sst'], e.target.checked); renderLegend(); };
$('tSat').onchange = (e) => vis(['sat'], e.target.checked);
$('tSpin').onchange = (e) => (spinning = e.target.checked);
// On small screens, tapping the globe tucks the menus away
map.on('click', () => { if (isCompact()) { $('controls').open = false; sheet(false); } });
$('bClass').onclick = () => {
  const on = document.body.classList.toggle('classroom');
  $('bClass').textContent = on ? 'Exit classroom mode' : 'Classroom mode';
};
</script>
